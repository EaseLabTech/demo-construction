<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact &amp; Free Quote — Ferron Construction SG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="page"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  /* Route: contact.html[?svc={service}&area={location}]
     Laravel equivalent: /contact */
  renderLayout("contact");
  const mapSrc = `https://maps.google.com/maps?q=${encodeURIComponent(COMPANY.address)}&z=15&output=embed`;

  $("#page").innerHTML = `
  <section class="page-hero">
    <div class="container">
      <nav class="crumbs"><a href="index.html">Home</a><i>/</i><span>Contact &amp; quote</span></nav>
      <div class="page-hero-grid">
        <div>
          <span class="eyebrow">Replies in ~15 min · 7 days a week</span>
          <h1 class="display h1 page-title">Let's get your<br>home <span class="serif ember">sorted.</span></h1>
        </div>
        <p class="lead">Answer three quick questions for an itemised quote on WhatsApp, or reach us directly. For burst pipes, power trips and other emergencies, call us any time.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(40px,5vw,72px)">
    <div class="container contact-grid">
      <div>
        <form class="wizard" id="wizard" novalidate></form>
        <div class="quote-perks" style="margin-top:28px">
          <div class="perk"><span class="pk-ico">${icon("tag")}</span><div><b>Transparent pricing</b><span>Itemised quote. No hidden charges or call-out surprises.</span></div></div>
          <div class="perk"><span class="pk-ico">${icon("award")}</span><div><b>Licensed &amp; insured</b><span>EMA, PUB licensed and BCA registered professionals.</span></div></div>
          <div class="perk"><span class="pk-ico">${icon("shield")}</span><div><b>Workmanship warranty</b><span>Every job covered, up to 5 years on waterproofing.</span></div></div>
        </div>
      </div>

      <aside class="contact-cards">
        <a class="c-card" target="_blank" rel="noopener" href="${waLink()}"><span class="pk-ico wa">${WA_ICON}</span><div><b>WhatsApp</b><span>Send photos for an instant estimate</span></div></a>
        <a class="c-card" href="tel:+${COMPANY.phoneRaw}"><span class="pk-ico">${icon("phone")}</span><div><b>${COMPANY.phone}</b><span>24/7 emergency hotline</span></div></a>
        <a class="c-card" href="mailto:${COMPANY.email}"><span class="pk-ico">${icon("mail")}</span><div><b>${COMPANY.email}</b><span>For tenders and larger projects</span></div></a>
        <div class="c-card"><span class="pk-ico">${icon("pin")}</span><div><b>Head office</b><span>${COMPANY.address}</span></div></div>
        <div class="map-embed"><iframe src="${mapSrc}" title="Map to Ferron Construction office" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
        <div class="hours">
          <h4>Opening hours</h4>
          <div><span>Mon – Fri</span><span>8am – 10pm</span></div>
          <div><span>Sat – Sun &amp; PH</span><span>9am – 9pm</span></div>
          <div><span>Emergencies</span><b>24 / 7</b></div>
        </div>
      </aside>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container faq-wrap">
      <div>
        <span class="eyebrow reveal">Before you ask</span>
        <h2 class="display h2 reveal section-title" style="margin-top:20px">Common <span class="serif">questions.</span></h2>
      </div>
      <div class="faq">${FAQS.map((f, i) => `
        <details class="reveal" ${i === 0 ? "open" : ""}>
          <summary>${f.q}<span class="pm">${icon("plus")}</span></summary>
          <p>${f.a}</p>
        </details>`).join("")}</div>
    </div>
  </section>`;

  mountWizard($("#wizard"));
  initReveal();
</script>
</body>
</html>
